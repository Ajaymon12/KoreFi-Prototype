# Builds the prototype as a static site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source -> "GitHub Actions".
name: Publish prototype

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          GITHUB_PAGES: "true" # switches next.config.ts to the static export under /<repo name>/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
